
name: Build and deploy Django to Azure - app-inscricoes-academicas01

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Upload Django backend for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DCBF95BBAC6243A19846F51A726803E6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_39F9044C7B1D4EBDB00D5DADC4B57B1A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2268C4AB304345AFA6C14B8F8460A25F }}

      - name: Deploy Django backend to Azure App Service
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-inscricoes-academicas01
          slot-name: Production
          package: .
