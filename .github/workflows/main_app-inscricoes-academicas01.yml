name: Deploy Django e frontend no Azure - app-inscricoes-academicas01

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias do backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Rodar testes do Django com SQLite temporario
        run: python backend/manage.py test api --noinput
        env:
          DATABASE_URL: 'sqlite:///:memory:'
          DJANGO_DEBUG: 'True'

      - name: Configurar Node para os testes do frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar JavaScript
        run: |
          node --check frontend/script.js
          node --check frontend/organizacao.js
          node frontend/testes_frontend.mjs

      - name: Copiar frontend para o Django
        run: |
          mkdir -p backend/templates backend/static/frontend
          cp frontend/index.html backend/templates/index.html
          cp frontend/style.css backend/static/frontend/style.css
          cp frontend/script.js backend/static/frontend/script.js
          cp frontend/organizacao.html backend/templates/organizacao.html
          cp frontend/organizacao.js backend/static/frontend/organizacao.js
          cp frontend/organizacao.css backend/static/frontend/organizacao.css

      - name: Coletar arquivos estaticos
        run: python backend/manage.py collectstatic --noinput

      - name: Criar artefato de implantacao
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend/
          if-no-files-found: error

  deploy:
    # A branch no repositÃ³rio oficial da equipe NÃƒO deve publicar
    # automaticamente na conta Azure pessoal utilizada no teste.
    if: github.repository == 'Luc4s22/cloud-challenge-inscricoes'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Baixar artefato do build
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Autenticar na Azure com identidade federada
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DCBF95BBAC6243A19846F51A726803E6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_39F9044C7B1D4EBDB00D5DADC4B57B1A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2268C4AB304345AFA6C14B8F8460A25F }}

      - name: Publicar no App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-inscricoes-academicas01
          slot-name: Production
          package: .

